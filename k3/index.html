<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課題3 レポートの書き方を学ぶ｜研究と仕事のマナー</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  /* 課題3専用：書く（最終レポート）のライブ点検 */
  .report-live h3 { margin-top: 0; }
  .report-live .live-item { border-top: 1px solid var(--line); padding: 10px 0 0; margin: 10px 0 0; }
  .report-live .live-head { display: flex; gap: 8px; align-items: baseline; font-weight: bold; }
  .report-live .live-mark { flex: none; min-width: 3em; font-size: 14px; padding: 0 6px; border-radius: 999px; text-align: center; }
  .report-live .live-mark.ok { background: var(--ok-bg); color: var(--ok); }
  .report-live .live-mark.warn { background: var(--warn-bg); color: var(--warn); }
  .report-live .live-detail { font-size: 15px; margin: 4px 0 0; }
  .report-live ol { margin: 4px 0 0; padding-left: 24px; }
  .report-live ol li { margin: 0 0 6px; }
  .report-live .ts-label { font-size: 14px; color: var(--muted); margin-right: 4px; }
  /* PC では横に並べる（本文の幅 760px の外へ広げる）。狭いときはフォームの下に回る。
     「③ 書く」の見出しも同じ幅に広げ、フォームと左端をそろえる */
  @media (min-width: 1100px) {
    #compose-sec > h2, .report-layout {
      --w: min(1160px, calc(100vw - 48px));
      width: var(--w);
      margin-left: calc((100% - var(--w)) / 2);
    }
    .report-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      align-items: start;
    }
    .report-layout > * { min-width: 0; }
    /* パネルの中でスクロールする。下に続きがあるときは下端に影を出し（下まで読むと消える）、
       スクロールバーは常に見せる（macOS の重ねて表示するスクロールバーでも消えないよう自分で描く） */
    .report-live {
      position: sticky;
      top: 12px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      background:
        linear-gradient(rgba(255, 255, 255, 0), var(--surface) 70%) 0 100% / 100% 48px no-repeat local,
        linear-gradient(rgba(31, 35, 40, 0), rgba(31, 35, 40, 0.28)) 0 100% / 100% 18px no-repeat scroll,
        var(--surface);
    }
    .report-live::-webkit-scrollbar { width: 12px; }
    .report-live::-webkit-scrollbar-track { background: var(--note-bg); border-radius: 0 var(--radius) var(--radius) 0; }
    .report-live::-webkit-scrollbar-thumb { background: #9aa1aa; border-radius: 6px; border: 2px solid var(--note-bg); }
    @supports not selector(::-webkit-scrollbar) {
      .report-live { scrollbar-width: auto; scrollbar-color: #9aa1aa var(--note-bg); }
    }
  }
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="home" href="../">← 研究と仕事のマナー（トップ）</a>
    <h1>課題3 レポートの書き方を学ぶ</h1>
    <p class="lead">レポートは、問いを立て、根拠を示して答える文章です。書き方の決まりをゲームで確かめてから、最後に自分のレポートを1本書きます。このレポートが、3つの課題の最終提出物です。</p>
    <nav aria-label="この課題の段">
      <ul class="steps">
        <li><a href="#learn-sec">① 学ぶ</a></li>
        <li><a href="#games-sec">② ゲーム</a></li>
        <li><a href="#compose-sec">③ 書く</a></li>
        <li><a href="#submit-sec">④ 提出</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="stage" id="learn-sec">
    <h2>① 学ぶ</h2>
    <div id="learn"><p class="pending">準備中です。</p></div>
  </section>
  <section class="stage" id="games-sec">
    <h2>② ゲーム</h2>
    <div id="games"><p class="pending">準備中です。</p></div>
  </section>
  <section class="stage" id="compose-sec">
    <h2>③ 書く</h2>
    <div id="compose"><p class="pending">準備中です。</p></div>
  </section>
  <section class="stage" id="submit-sec">
    <h2>④ 提出</h2>
    <div id="submit"><p class="pending">準備中です。</p></div>
  </section>
  <footer class="site-foot">
    <p><a href="../">研究と仕事のマナー（トップ）へ戻る</a></p>
    <p>締切：2026年12月31日（木）23:59。WebClass の課題3の提出欄に、④で作る .txt ファイルを提出します。</p>
  </footer>
</main>
<script src="../assets/js/scoring.js"></script>
<script src="../assets/js/core.js"></script>
<script src="../assets/js/games.js"></script>
<script src="../assets/js/compose.js"></script>
<script src="report.js"></script>
<script>
  // 課題3の組み立て。問題と解説は data/k3.json に入れる。
  // 書くのフォーム（最終レポート）。点検は k3/report.js の MNReport.check で行い、横（狭いときは下）に表示する
  var COMPOSE = [
    {
      id: "report",
      title: "最終レポート",
      kind: "書く",
      intro: "次のテーマから1つ選び、1,200〜2,000字のレポートを書きます。出典を2つ以上使い、引用は課題2のルールに従います。自分の名前や学籍番号は書きません。Word などで書いてから貼り付けてもかまいません。",
      fields: [
        { id: "theme", label: "テーマ", type: "radio", required: true, options: MN.THEMES },
        { id: "stance", label: "あなたの答え", type: "radio", required: true,
          options: [{ id: "yes", t: "はい" }, { id: "no", t: "いいえ" }, { id: "cond", t: "条件による" }] },
        { id: "title", label: "題", type: "text", max: 60 },
        { id: "question", label: "問い", type: "text", max: 120, hint: "例：大学のレポートで生成AIの使用を認めるべきか" },
        { id: "answer", label: "答え（主張）を1〜2文で", type: "textarea", rows: 2, max: 200 },
        { id: "p_intro", label: "序論", type: "textarea", rows: 6, max: 700 },
        { id: "p_body1", label: "本論1", type: "textarea", rows: 8, max: 900 },
        { id: "p_body2", label: "本論2", type: "textarea", rows: 8, max: 900 },
        { id: "p_body3", label: "本論3（任意）", type: "textarea", rows: 8, max: 900 },
        { id: "p_concl", label: "結論", type: "textarea", rows: 6, max: 700 },
        { id: "refs", label: "参考文献", type: "textarea", rows: 6, max: 1000, hint: "1行に1つ、課題2で学んだ形式で" },
        { id: "self_review", label: "自己点検", type: "textarea", rows: 3, max: 400,
          hint: "最初の文だけを読み返して、直したところを1つ書く（どこを、なぜ、どう直したか）" }
      ]
    }
  ];

  // ライブ点検の表示
  function renderLive(panel, v) {
    var el = MN.el;
    var r = MNReport.check(v);
    function where(list) {
      return list.map(function (x) { return x.label + " " + x.index + "文目"; }).join("、");
    }
    function hits(list) {
      return list.map(function (x) { return "「" + x.w + "」" + x.n + "回"; }).join("、");
    }
    function item(key, title, ok, detail) {
      return el("div", { class: "live-item", "data-live": key, "data-ok": ok ? "1" : "0" }, [
        el("div", { class: "live-head" }, [
          el("span", { class: "live-mark " + (ok ? "ok" : "warn"), text: ok ? "○" : "注意" }),
          el("span", { text: title })
        ]),
        detail ? el("p", { class: "live-detail", text: detail }) : null
      ]);
    }
    MN.clear(panel);
    panel.appendChild(el("h3", { text: "ライブ点検" }));
    panel.appendChild(el("p", { class: "small muted", text: "目安です。点数にはなりません。" }));

    var ts = el("div", { class: "live-item", "data-live": "topics" }, [
      el("div", { class: "live-head", text: "最初の文だけで、筋が通りますか？" })
    ]);
    if (r.topics.length) {
      ts.appendChild(el("ol", { "data-role": "topic-list" }, r.topics.map(function (t) {
        return el("li", null, [el("span", { class: "ts-label", text: t.label }), t.text]);
      })));
    } else {
      ts.appendChild(el("p", { class: "live-detail muted", text: "序論〜結論を書くと、各段落の最初の文がここに並びます。" }));
    }
    panel.appendChild(ts);

    panel.appendChild(item("chars", "字数（空白・改行を除く）：" + r.chars.n + "字", r.chars.ok,
      "序論〜結論の合計。1,200〜2,000字なら ○"));
    panel.appendChild(item("refs", "出典の数：" + r.refs.n, r.refs.ok, "2つ以上なら ○"));
    panel.appendChild(item("cite", "引用の「」：" + r.cite.quotes + "　本文中の出典の示し方：" + r.cite.marks, r.cite.ok,
      "「山本（2022）」のような括弧の中の年、または［1］のような番号を数えています"));
    panel.appendChild(item("colloquial", "話し言葉の候補", r.colloquial.ok,
      r.colloquial.hits.length ? hits(r.colloquial.hits) : "見つかりません"));
    panel.appendChild(item("conj", "接続詞：" + r.conj.total + "回", r.conj.ok,
      (r.conj.hits.length ? hits(r.conj.hits) + "。" : "") + "目安は200字につき1回まで（いまは " + Math.floor(r.conj.limit) + " 回まで）"));
    panel.appendChild(item("long", "長い文（80字超）：" + r.long.list.length, r.long.ok,
      r.long.list.length ? where(r.long.list) : "ありません"));
    panel.appendChild(item("desumasu", "「です・ます」の文：" + r.desumasu.list.length, r.desumasu.ok,
      r.desumasu.list.length ? where(r.desumasu.list) + "（「だ・である」にそろえます）" : "混ざっていません"));
  }

  // 課題2の作る「引用してみる」で書いた出典（空でないもの）
  function k2Refs() {
    var c = MN.compose.read(2, "cite");
    if (!c) return [];
    return [c.src1_ref, c.src2_ref].filter(function (x) { return typeof x === "string" && x.trim(); });
  }

  function setupReport() {
    var form = document.querySelector('[data-compose="report"]');
    if (!form) return;
    var layout = MN.el("div", { class: "report-layout" });
    form.parentNode.insertBefore(layout, form);
    layout.appendChild(form);
    var panel = MN.el("aside", { class: "card report-live", "aria-label": "ライブ点検", "data-role": "report-live" });
    layout.appendChild(panel);

    function values() {
      var v = {};
      Array.prototype.forEach.call(form.querySelectorAll("[data-field]"), function (e) { v[e.getAttribute("data-field")] = e.value; });
      return v;
    }
    function update() { renderLive(panel, values()); }
    form.addEventListener("input", update);
    form.addEventListener("change", update);
    update();

    // 「課題2で書いた出典を読み込む」：課題2の保存が無ければ出さない
    var refs = form.querySelector('[data-field="refs"]');
    if (refs && k2Refs().length) {
      var msg = MN.el("span", { class: "small", "aria-live": "polite", "data-role": "import-msg" });
      var btn = MN.el("button", { type: "button", class: "sub", "data-action": "import-k2-refs" }, "課題2で書いた出典を読み込む");
      btn.addEventListener("click", function () {
        var r = MNReport.appendRefs(refs.value, k2Refs());
        var max = Number(refs.getAttribute("maxlength")) || Infinity;
        if (r.added.length) {
          refs.value = r.text;
          // compose.js の保存・字数・点検の更新に合わせる（上限を超えた分は compose.js が切る）
          refs.dispatchEvent(new Event("input", { bubbles: true }));
          msg.textContent = r.text.length > max
            ? " 上限の " + max + " 字を超えたため、一部を追加できませんでした。"
            : " " + r.added.length + " 件を参考文献の末尾に追加しました。";
        } else {
          msg.textContent = " 課題2の出典は、すでに入っています。";
        }
      });
      refs.parentNode.insertBefore(MN.el("div", { class: "actions", style: "margin: 0 0 8px" }, [btn, msg]), refs);
    }
  }

  MN.page.boot({
    kadai: 3,
    data: "../data/k3.json",
    compose: COMPOSE,
    submit: { requiredGames: ["order", "topic", "find"], requiredCompose: ["report"] }
  }).then(setupReport);
</script>
</body>
</html>
